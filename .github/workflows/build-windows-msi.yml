name: Build Windows MSI
on:
  workflow_dispatch:
  push:
    paths:
      - "installers/windows/**"
      - ".github/workflows/build-windows-msi.yml"
jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install WiX
        run: dotnet tool install --global wix --version 6.*
      - name: Build MSI
        working-directory: installers/windows
        run: wix build -arch x64 Product.wxs -o TimeWatcher-Windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: TimeWatcher-Windows-MSI
          path: installers/windows/TimeWatcher-Windows.msi
